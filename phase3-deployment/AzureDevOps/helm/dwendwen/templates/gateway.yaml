apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: gateway
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/gateway-config.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      containers:
      - name: gateway
        image: {{ .Values.gateway.image | quote }}
        ports:
        - { name: http, containerPort: 8080 }
        securityContext:
          runAsNonRoot: true
          runAsUser: 101
          allowPrivilegeEscalation: false
          capabilities: { drop: [ALL] }
        readinessProbe:
          httpGet: { path: /healthz, port: http }
        livenessProbe:
          httpGet: { path: /healthz, port: http }
        resources:
          requests: { cpu: 100m, memory: 64Mi }
          limits: { cpu: 500m, memory: 128Mi }
        volumeMounts:
        - name: configuration
          mountPath: /etc/nginx/conf.d
          readOnly: true
      volumes:
      - name: configuration
        configMap:
          name: {{ .Release.Name }}-gateway
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-gateway
spec:
  type: {{ .Values.gateway.serviceType }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: gateway
  ports:
  - { name: http, port: 80, targetPort: http }
