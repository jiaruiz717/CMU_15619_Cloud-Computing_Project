{{- if and .Values.services.mix.enabled (eq .Values.image.stack "dotnet") }}
{{- fail "mix_dotnet is not implemented; disable services.mix.enabled." }}
{{- end }}
{{- range $name, $service := .Values.services }}
{{- if $service.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/name: {{ $name }}
spec:
  replicas: {{ $service.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/name: {{ $name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
      - name: {{ $name }}
        image: {{ printf "%s/dwendwen/%s-%s:%s" $.Values.image.registry $name $.Values.image.stack $.Values.image.tag | quote }}
        imagePullPolicy: {{ $.Values.image.pullPolicy }}
        ports:
        - { name: http, containerPort: 8080 }
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: [ALL] }
        {{- if or (eq $name "m3") (eq $name "mix") }}
        envFrom:
        - secretRef:
            name: {{ required "database.existingSecret is required" $.Values.database.existingSecret | quote }}
        {{- end }}
        # Existing apps do not expose a common health route; TCP checks startup/listening only.
        startupProbe:
          tcpSocket: { port: http }
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          tcpSocket: { port: http }
          periodSeconds: 5
        livenessProbe:
          tcpSocket: { port: http }
          periodSeconds: 15
          failureThreshold: 5
        resources:
          {{- toYaml $.Values.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/name: {{ $name }}
  ports:
  - { name: http, port: 80, targetPort: http }
{{- end }}
{{- end }}
