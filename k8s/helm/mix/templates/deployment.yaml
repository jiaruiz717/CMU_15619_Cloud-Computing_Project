apiVersion: apps/v1
kind: Deployment
metadata:
  name: mix-deployment
spec:
  replicas: 6
  selector:
    matchLabels:
      app: mix
  template:
    metadata:
      labels:
        app: mix
    spec:
      containers:
      - name: mix
        image: 144331934093.dkr.ecr.us-east-1.amazonaws.com/mix:jooby
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: mix-config